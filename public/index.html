<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --px: 4px;
    --ink: #303040;
    --paper: #f8f8f0;
    --frame: #4878b8;
    --frame-dark: #284878;
    --accent: #d97757;
    --bg: #101018;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font-family: 'Pixelify Sans', ui-monospace, monospace; }
  #screen { position: relative; width: min(100vw, 150vh); aspect-ratio: 3 / 2; image-rendering: pixelated; }
  #game, #game canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .hidden { display: none !important; }

  .box {
    position: absolute; background: var(--paper);
    border: calc(var(--px) * 1) solid var(--frame-dark);
    box-shadow: inset 0 0 0 calc(var(--px) * 1) #fff, inset 0 0 0 calc(var(--px) * 2) var(--frame);
    border-radius: calc(var(--px) * 3);
    padding: calc(var(--px) * 5) calc(var(--px) * 7);
    font-size: calc(var(--px) * 7.5); line-height: 1.35; color: var(--ink);
  }
  #dialog { left: calc(var(--px) * 3); right: calc(var(--px) * 3); bottom: calc(var(--px) * 3); height: calc(var(--px) * 46); }
  #dtext { white-space: pre-wrap; overflow: hidden; height: 100%; }
  #dtext.small { font-size: calc(var(--px) * 6); }
  #dmore { position: absolute; right: calc(var(--px) * 7); bottom: calc(var(--px) * 3); color: var(--accent); animation: bob .6s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(calc(var(--px) * 1.5)); } }

  #choices { right: calc(var(--px) * 3); bottom: calc(var(--px) * 51); max-width: 70%; max-height: calc(var(--px) * 104); overflow-y: auto; padding-left: calc(var(--px) * 12); }
  #choices.menu { top: calc(var(--px) * 3); bottom: auto; min-width: calc(var(--px) * 64); }
  .opt { position: relative; padding: calc(var(--px) * 1) 0; }
  .opt.sel::before { content: '▶'; position: absolute; left: calc(var(--px) * -8); color: var(--ink); }

  #panel { left: calc(var(--px) * 8); right: calc(var(--px) * 8); top: calc(var(--px) * 8); bottom: calc(var(--px) * 8); display: flex; flex-direction: column; }
  #ptitle { font-weight: 600; color: var(--frame-dark); margin-bottom: calc(var(--px) * 3); display: flex; justify-content: space-between; }
  #plist { flex: 1; overflow-y: auto; padding-left: calc(var(--px) * 9); }
  #plist .opt { padding: calc(var(--px) * 1.5) 0; border-bottom: calc(var(--px) * .5) dashed #c8c8c0; }
  #plist .sub { font-size: calc(var(--px) * 5.5); color: #686878; }
  #plist .tag { display: inline-block; font-size: calc(var(--px) * 5); padding: 0 calc(var(--px) * 2); border-radius: calc(var(--px) * 1); color: #fff; margin-right: calc(var(--px) * 2); vertical-align: middle; }
  #pheader { margin-bottom: calc(var(--px) * 3); font-size: calc(var(--px) * 6); color: #484858; }
  #pheader img { display: block; width: 100%; max-height: calc(var(--px) * 70); object-fit: contain; image-rendering: pixelated; border-radius: calc(var(--px) * 1); background: #284020; }
  .hp { height: calc(var(--px) * 4); background: #383848; border-radius: calc(var(--px) * 1); overflow: hidden; margin: calc(var(--px) * 2) 0; }
  .hp > i { display: block; height: 100%; background: linear-gradient(#78e078, #38a038); }
  .hp.low > i { background: linear-gradient(#f8d058, #c89820); }
  .hp.crit > i { background: linear-gradient(#f87858, #c03828); }
  .lore { font-style: italic; color: #686878; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 calc(var(--px) * 6); }
  #phint, .hint { font-size: calc(var(--px) * 5); color: #787888; margin-top: calc(var(--px) * 2); }

  #input { left: calc(var(--px) * 12); right: calc(var(--px) * 12); top: calc(var(--px) * 22); }
  #itext { width: 100%; height: calc(var(--px) * 44); margin-top: calc(var(--px) * 3); font: inherit; font-size: calc(var(--px) * 6.5); border: calc(var(--px) * .5) solid var(--frame); border-radius: calc(var(--px) * 1); padding: calc(var(--px) * 2); background: #fff; color: var(--ink); resize: none; outline: none; }

  #startmenu { right: calc(var(--px) * 3); top: calc(var(--px) * 3); padding-left: calc(var(--px) * 12); min-width: calc(var(--px) * 64); }

  #banner {
    position: absolute; left: calc(var(--px) * 3); top: calc(var(--px) * 3);
    background: #f8f0d8; border: calc(var(--px) * 1) solid #886830; border-radius: calc(var(--px) * 1);
    padding: calc(var(--px) * 2) calc(var(--px) * 6); font-size: calc(var(--px) * 7); color: #503818;
    animation: slide 2.8s forwards;
  }
  @keyframes slide { 0% { transform: translateY(-150%); } 12%, 85% { transform: none; } 100% { transform: translateY(-150%); } }

  #toasts { position: absolute; right: calc(var(--px) * 3); top: calc(var(--px) * 3); display: flex; flex-direction: column; gap: calc(var(--px) * 2); align-items: flex-end; pointer-events: none; }
  .toast { position: static; max-width: calc(var(--px) * 150); padding: calc(var(--px) * 3) calc(var(--px) * 5); font-size: calc(var(--px) * 5.5); animation: toast 6s forwards; }
  .toast b { color: var(--accent); }
  @keyframes toast { 0% { opacity: 0; transform: translateX(20%); } 6%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  #guide { position: absolute; left: calc(var(--px) * 3); bottom: calc(var(--px) * 10); max-width: calc(100% - var(--px) * 6); font-size: calc(var(--px) * 5.5); color: #fff8e0; background: #181820c0; border: calc(var(--px) * .5) solid #f8c06080; border-radius: calc(var(--px) * 1.5); padding: calc(var(--px) * 1) calc(var(--px) * 3); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #guide { transition: opacity .8s; }
  #guide.quiet { opacity: .45; }
  #pointer { position: absolute; width: 0; height: 0; pointer-events: none; transition: left .25s linear, top .25s linear; }
  #pointer i { position: absolute; left: calc(var(--px) * -4); top: calc(var(--px) * -4); width: calc(var(--px) * 8); height: calc(var(--px) * 8); transform: rotate(var(--ang)); animation: nudge 1.4s ease-in-out infinite; }
  #pointer i::before { content: ''; position: absolute; inset: 0; background: #fff4d0; clip-path: polygon(100% 50%, 15% 8%, 35% 50%, 15% 92%); filter: drop-shadow(0 0 calc(var(--px) * .5) #181820) drop-shadow(0 0 calc(var(--px) * .5) #181820) drop-shadow(0 0 calc(var(--px) * 2) #f8c060a0); opacity: .9; }
  #pointer.over i { animation: hover 1.1s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { translate: 0 0; opacity: .55; } 50% { translate: calc(cos(var(--ang)) * var(--px) * 2) calc(sin(var(--ang)) * var(--px) * 2); opacity: 1; } }
  @keyframes hover { 0%, 100% { translate: 0 0; opacity: .6; } 50% { translate: 0 calc(var(--px) * -2); opacity: 1; } }
  #hud { position: absolute; left: calc(var(--px) * 3); bottom: calc(var(--px) * 3); font-size: calc(var(--px) * 5); color: #fff; text-shadow: 0 calc(var(--px) * .5) 0 #000; pointer-events: none; }
  .box { z-index: 2; }
  button.back, button.send { font: inherit; font-size: calc(var(--px) * 5); cursor: pointer; border: calc(var(--px) * .5) solid var(--frame-dark); border-radius: calc(var(--px) * 1); background: #fff; color: var(--frame-dark); padding: 0 calc(var(--px) * 2.5); }
  button.send { background: var(--frame); color: #fff; }
  button.back:hover, button.send:hover { filter: brightness(1.1); }
  #choices button.back { display: block; margin: 0 0 calc(var(--px) * 1.5) calc(var(--px) * -6); }
  #ptitle button.back { margin-right: calc(var(--px) * 3); vertical-align: middle; }
  .ibar { display: flex; gap: calc(var(--px) * 3); align-items: center; }
  .ibar span { flex: 1; text-align: center; }
  .opt, #dialog { cursor: pointer; }
  #reward { left: 50%; top: 18%; transform: translateX(-50%); text-align: center; min-width: calc(var(--px) * 120); max-width: 80%; padding: calc(var(--px) * 5) calc(var(--px) * 9); animation: reward 2.6s ease-out forwards; }
  #reward .icon { font-size: calc(var(--px) * 16); line-height: 1; color: #f8c040; text-shadow: 0 0 calc(var(--px) * 4) #f8c040, 0 calc(var(--px) * 1) 0 #a06010; animation: spin 2.6s ease-out; }
  #reward .title { font-weight: 600; font-size: calc(var(--px) * 10); color: var(--frame-dark); letter-spacing: calc(var(--px) * .5); margin-top: calc(var(--px) * 2); }
  #reward .sub { font-size: calc(var(--px) * 5.5); color: #585868; margin-top: calc(var(--px) * 1); }
  @keyframes reward { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.06); } 18%, 86% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 0) scale(.96); } }
  @keyframes spin { 0% { transform: rotateY(0) scale(.4); } 30% { transform: rotateY(720deg) scale(1.2); } 40%, 100% { transform: rotateY(720deg) scale(1); } }
  #minimap { position: absolute; left: calc(var(--px) * 3); top: calc(var(--px) * 3); width: var(--mmw); border: calc(var(--px) * 1) solid var(--frame-dark); box-shadow: 0 0 0 calc(var(--px) * .5) #fff, 0 calc(var(--px) * 1) 0 calc(var(--px) * .5) #0006; border-radius: calc(var(--px) * 2); overflow: hidden; background: #284020; pointer-events: none; }
  #screen { --mmw: calc(var(--px) * 44); --mmh: calc(var(--mmw) * 16 / 24); }
  #screen[data-mm-size=s] { --mmw: calc(var(--px) * 34); }
  #screen[data-mm-size=l] { --mmw: calc(var(--px) * 60); }
  #screen[data-mm=tr] #minimap { left: auto; right: calc(var(--px) * 3); }
  #screen[data-mm=bl] #minimap { top: auto; bottom: calc(var(--px) * 12); }
  #screen[data-mm=br] #minimap { top: auto; left: auto; right: calc(var(--px) * 3); bottom: calc(var(--px) * 3); }
  /* Keep the area banner and toasts clear of the minimap. */
  #screen[data-mm=tl] #banner { left: calc(var(--mmw) + var(--px) * 6); }
  #screen[data-mm=tr] #toasts { top: calc(var(--mmh) + var(--px) * 6); }
  #minimap canvas { display: block; width: 100%; image-rendering: pixelated; }
  #minimap .name { position: absolute; left: 0; right: 0; bottom: 0; font-size: calc(var(--px) * 3.5); color: #fff; text-align: center; background: #181820b0; padding: calc(var(--px) * .5) 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #townmap { position: absolute; inset: 0; z-index: 3; background: radial-gradient(#2a3a5a, #101018); display: grid; place-items: center; }
  #townmap canvas { height: 76%; aspect-ratio: 4 / 3; margin-top: -14%; image-rendering: auto; border: calc(var(--px) * 1) solid #f8e0b0; border-radius: calc(var(--px) * 2); box-shadow: 0 0 0 calc(var(--px) * 1) #181820, 0 0 calc(var(--px) * 12) #d9775760; }
  #townmap .bar { left: calc(var(--px) * 3); right: calc(var(--px) * 3); bottom: calc(var(--px) * 3); padding: calc(var(--px) * 2.5) calc(var(--px) * 6); display: grid; grid-template-columns: 1fr auto; column-gap: calc(var(--px) * 4); }
  #townmap .place { font-weight: 600; color: var(--frame-dark); }
  #townmap .sub { grid-column: 1; font-size: calc(var(--px) * 5); color: #585868; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #townmap .act { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: calc(var(--px) * 5.5); color: var(--accent); }
  #townmap .legend { grid-column: 1 / 3; font-size: calc(var(--px) * 4.5); color: #787888; margin-top: calc(var(--px) * 1); }
  #townmap .legend i { display: inline-block; width: calc(var(--px) * 3); height: calc(var(--px) * 3); border: calc(var(--px) * .5) solid #181820; margin: 0 calc(var(--px) * 1) 0 calc(var(--px) * 2); vertical-align: middle; }
  #boot { z-index: 1; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: calc(var(--px) * 8); text-align: center; background: var(--bg); }
  #boot .title { font-size: calc(var(--px) * 16); letter-spacing: calc(var(--px) * .5); color: #f8e0b0; text-shadow: 0 calc(var(--px) * 1) 0 #d97757; margin-top: calc(var(--px) * -24); }
  #boot .title small { font-size: calc(var(--px) * 6); color: #a8a8c0; text-shadow: none; letter-spacing: 0; }
  #choices.title { left: 50%; right: auto; bottom: calc(var(--px) * 22); transform: translateX(-50%); min-width: calc(var(--px) * 64); }
  #boot .warden { width: calc(var(--px) * 64); height: calc(var(--px) * 64); image-rendering: pixelated; margin-top: calc(var(--px) * -40); filter: drop-shadow(0 0 calc(var(--px) * 8) #d9775780); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translateY(calc(var(--px) * -1.5)); } }
  #boot small { display: block; font-size: calc(var(--px) * 5); color: #aaa; margin-top: calc(var(--px) * 3); }
</style>
</head>
<body>
<div id="screen">
  <div id="game"></div>
  <div id="pointer" class="hidden"><i></i></div>
  <div id="guide" class="hidden"></div>
  <div id="hud"></div>
  <div id="banner" class="hidden"></div>
  <div id="toasts"></div>
  <div id="dialog" class="box hidden"><div id="dtext"></div><div id="dmore" class="hidden">▼</div></div>
  <div id="choices" class="box hidden"></div>
  <div id="startmenu" class="box hidden"></div>
  <div id="panel" class="box hidden"><div id="ptitle"></div><div id="pheader" class="hidden"></div><div id="plist"></div><div id="phint">↑↓ choose · Z open · X close</div></div>
  <div id="input" class="box hidden"><div id="ilabel"></div><textarea id="itext" spellcheck="true"></textarea><div class="hint ibar"><button class="back" onclick="UI.press('Escape')">◀ Back</button><span>Enter send · Shift+Enter new line · Esc back</span><button class="send" onclick="UI.press('Enter')">Send ▶</button></div></div>
  <div id="minimap" class="hidden"><canvas></canvas><div class="name"></div></div>
  <div id="townmap" class="hidden"><canvas></canvas><div class="bar box"><div class="place"></div><div class="sub"></div><div class="act"></div><div class="legend"><i style="background:#fff"></i>You <i style="background:#ffb080"></i>Claude <i style="background:#ff3838"></i>Boss · ←↑↓→ move · Z warp · X close</div></div></div>
  <div id="reward" class="box hidden"><div class="icon"></div><div class="title"></div><div class="sub"></div></div>
  <div id="boot">CLAUDE QUEST<small>Loading the world…</small></div>
</div>
<script src="/phaser.js"></script>
<script src="/ui.js"></script>
<script src="/art.js"></script>
<script src="/world.js"></script>
<script src="/map.js"></script>
<script src="/music.js"></script>
</body>
</html>
