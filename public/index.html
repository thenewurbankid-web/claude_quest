<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<script>
  // Pairing links (#link=…) and the full game's features still live in the 2D page; send them there.
  if (/[#&]link=/.test(location.hash)) location.replace('2d.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #10131f; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    font: 600 15px 'Nunito', system-ui, sans-serif; color: #fff; letter-spacing: .02em;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); display: grid; gap: 2px; pointer-events: none; }
  .hud small { font: 400 12px system-ui, sans-serif; opacity: .75; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(68px, env(safe-area-inset-bottom)); /* above the Ember dock */
    font: 400 13px system-ui, sans-serif; color: #fff; background: rgba(16,19,31,.45); padding: 6px 12px;
    border-radius: 999px; backdrop-filter: blur(6px); pointer-events: none; white-space: nowrap; }
  .pad { position: fixed; right: 20px; bottom: 56px; display: none; grid-template: repeat(3, 52px) / repeat(3, 52px); gap: 4px; }
  .pad button { border: 0; border-radius: 12px; background: rgba(255,255,255,.18); color: #fff; font: 600 20px system-ui;
    backdrop-filter: blur(6px); touch-action: none; }
  @media (pointer: coarse) { .pad { display: grid; } .hint { display: none; } }
  .chip { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top));
    display: grid; gap: 1px; text-align: right; border: 0; cursor: pointer; color: #fff; padding: 7px 12px;
    background: rgba(16,19,31,.42); border-radius: 12px; backdrop-filter: blur(6px); }
  .chip b { font: 600 14px 'Nunito', system-ui, sans-serif; letter-spacing: .02em; }
  .chip small { font: 400 11px system-ui, sans-serif; opacity: .75; }
  .chip:hover { background: rgba(16,19,31,.6); }
  .links { position: fixed; right: max(16px, env(safe-area-inset-right)); top: calc(max(14px, env(safe-area-inset-top)) + 52px);
    display: flex; gap: 6px; }
  .links a { font: 400 12px system-ui, sans-serif; color: #fff; text-decoration: none; padding: 5px 10px;
    background: rgba(16,19,31,.42); border-radius: 999px; backdrop-filter: blur(6px); }
  .links a:hover { background: rgba(16,19,31,.6); }
  /* Quest overlays (public/quest/): the Ledger toggle under the place name, the Beacon HUD under the links. */
  body .qlp-toggle { top: calc(max(14px, env(safe-area-inset-top)) + 48px); left: max(16px, env(safe-area-inset-left)); }
  body .qlp-panel { top: calc(max(14px, env(safe-area-inset-top)) + 84px); left: max(16px, env(safe-area-inset-left));
    max-height: calc(100vh - 150px); }
  body .qbh-root { top: calc(max(14px, env(safe-area-inset-top)) + 92px); right: max(16px, env(safe-area-inset-right));
    max-height: calc(100vh - 160px); }
  @media (pointer: coarse) { body .qbh-root { max-height: calc(100vh - 340px); } }
  .veil { position: fixed; inset: 0; background: #10131f; transition: opacity .8s ease; pointer-events: none; }
  body.ready .veil { opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud"><span id="time">Ember Hollow</span><small id="models">Loading…</small></div>
<nav class="links"><a href="2d.html" title="The full game: towns, missions, mail">2D game</a><a href="settings.html">Settings</a><a href="editor.html" title="Browse, import and export the game art">Editor</a></nav>
<button id="weather" class="chip" title="Weather (R) · Shift-click goes back">Weather</button>
<div class="hint">Arrows or WASD to walk · R weather · T preview a day</div>
<div class="pad" aria-label="Movement">
  <span></span><button data-dir="up" aria-label="Up">▲</button><span></span>
  <button data-dir="left" aria-label="Left">◀</button><span></span><button data-dir="right" aria-label="Right">▶</button>
  <span></span><button data-dir="down" aria-label="Down">▼</button><span></span>
</div>
<div class="veil"></div>
<script type="module" src="3d/scene.js"></script>
<script type="module" src="quest/boot.js"></script>
</body>
</html>
