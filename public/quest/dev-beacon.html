<!doctype html>
<!-- Dev page for the Beacon HUD (R0): the sample Realm in a memoryStore, the HUD over a stand-in for the 3D canvas,
     and buttons that change the store so the HUD can be watched updating. Serve with: node dev/static.js 4792 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon HUD dev</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; background: radial-gradient(ellipse at 30% 70%, #2f5d3a 0%, #1b2f3f 45%, #0c1220 100%);
      color: #eef0f4; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
    .dev { position: fixed; left: 16px; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .dev button { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1); color: inherit; font: inherit; cursor: pointer; }
    .dev button:hover { background: rgba(255,255,255,.2); }
  </style>
</head>
<body>
  <div class="dev" aria-label="Dev controls">
    <button type="button" data-act="unblock">Unblock Payment provider</button>
    <button type="button" data-act="finish">Finish every Work in the Hall of the Tollkeeper</button>
    <button type="button" data-act="answer">Seal every waiting Riddle</button>
    <button type="button" data-act="block">Block Pricing page (high)</button>
    <button type="button" data-act="unmount">Unmount / remount HUD</button>
    <button type="button" data-act="reset">Reset sample Realm</button>
  </div>
  <script type="module">
    import { memoryStore } from './contract.js';
    import { mountBeaconHud } from './beacon-hud.js';

    const sample = await (await fetch('./sample-realm.json')).json();
    const store = memoryStore(sample);
    let hud = mountBeaconHud(document.body, store);
    window.questStore = store; // for poking at from the console

    const now = () => new Date().toISOString();
    const work = async id => (await store.snapshot()).works.find(w => w.id === id);
    const acts = {
      async unblock() { await store.put('works', { ...(await work('w4')), status: 'in_progress', failures: 0 }); },
      async finish() {
        for (const w of (await store.snapshot()).works.filter(w => w.hallId === 'ferry-b' && !w.resolvedAt))
          await store.put('works', { ...w, status: 'done', failures: 0, resolvedAt: now() });
      },
      async answer() {
        for (const r of (await store.snapshot()).riddles.filter(r => ['open', 'deferred'].includes(r.state)))
          await store.put('riddles', { ...r, state: 'sealed', sealed_by: 'player', resolvedAt: now(),
            answer: { text: (r.options || ['Yes'])[0], by: 'player', at: now() } });
      },
      async block() { await store.put('works', { ...(await work('w3')), status: 'blocked' }); },
      unmount() { if (hud) { hud.destroy(); hud = null; } else hud = mountBeaconHud(document.body, store); },
      async reset() { await store.replace(sample); },
    };
    document.querySelector('.dev').addEventListener('click', e => {
      const act = e.target.closest('button')?.dataset.act;
      if (act) acts[act]();
    });
  </script>
</body>
</html>
